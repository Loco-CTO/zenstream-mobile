name: Android CI

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact candidate commit to validate
        required: true
        type: string
      skip_coverage_upload:
        description: Skip the external coverage report for release validation
        required: false
        default: false
        type: boolean
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Verify candidate checkout
        if: inputs.candidate_sha != ''
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;37.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run formatting, lint, unit tests, coverage, and debug build
        run: bash ./gradlew spotlessCheck lint :app:koverXmlReport assembleDebug

      - name: Generate temporary release signing key
        shell: bash
        run: |
          set -euo pipefail
          store_password="$(openssl rand -hex 24)"
          echo "::add-mask::$store_password"
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/zenstream-ci-release.jks" \
            -storepass "$store_password" \
            -keypass "$store_password" \
            -alias zenstream-ci-release \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=ZenStream CI Release Smoke"
          {
            echo "ANDROID_RELEASE_STORE_FILE=$RUNNER_TEMP/zenstream-ci-release.jks"
            echo "ANDROID_RELEASE_STORE_PASSWORD=$store_password"
            echo "ANDROID_RELEASE_KEY_ALIAS=zenstream-ci-release"
            echo "ANDROID_RELEASE_KEY_PASSWORD=$store_password"
          } >> "$GITHUB_ENV"

      - name: Build release APK for emulator smoke
        run: bash ./gradlew assembleRelease -PzenstreamMain=0 -PzenstreamRelease=true

      - name: Install and launch release APK on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ./scripts/smoke-release-apk.sh app/build/outputs/apk/release/app-release.apk

      - name: Install DeepSource CLI
        if: ${{ !inputs.skip_coverage_upload }}
        run: curl -fsSL https://cli.deepsource.com/install | BINDIR=./bin sh

      - name: Upload Kotlin coverage
        if: ${{ !inputs.skip_coverage_upload }}
        run: ./bin/deepsource report --analyzer test-coverage --key kotlin --value-file app/build/reports/kover/report.xml --use-oidc
