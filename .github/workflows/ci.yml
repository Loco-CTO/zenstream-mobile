name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;37.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply formatting on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash ./gradlew spotlessApply

      - name: Run formatting, lint, tests, and debug build
        run: bash ./gradlew spotlessCheck lint test assembleDebug
