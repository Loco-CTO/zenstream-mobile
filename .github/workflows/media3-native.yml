name: Media3 native decoder rebuild

on:
  workflow_dispatch:
  pull_request:
    paths:
      - third_party/media3-nextlib/**
      - .github/workflows/media3-native.yml

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify checked artifact
        run: python3 third_party/media3-nextlib/verify.py
      - name: Rebuild locked sources without replacing the checked artifact
        run: python3 third_party/media3-nextlib/rebuild.py
      - uses: actions/upload-artifact@v7
        with:
          name: rebuilt-media3-decoder
          path: build/nextlib/nextlib-media3ext-*.aar
          if-no-files-found: error
